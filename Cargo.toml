[package]
name = "baseball-history-desktop"
version = "0.1.1"
edition = "2024"
description = "Cross-platform desktop client for the Baseball History Project"
license = "MIT"

# App bundle metadata for `cargo bundle` (https://github.com/burtonageo/cargo-bundle).
# Running as a bundle gives macOS a bundle identifier, which the system
# frameworks (window tabbing, App Intents) expect.
[package.metadata.bundle]
name = "Baseball History"
identifier = "com.baseballhistoryproject.desktop"
copyright = "Data from the Lahman Baseball Database (CC BY-SA 3.0)"
category = "public.app-category.sports"
short_description = "Explore 150 years of baseball history."
# Libraries the Linux binary links or loads at runtime (X11/Wayland input,
# fonts and Vulkan rendering).
deb_depends = ["libc6", "libxcb1", "libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libfontconfig1", "libvulkan1"]
long_description = "A desktop client for the Baseball History Project API: players, teams, ballparks, leaderboards, the Hall of Fame, awards, postseason results and salaries."

[package.metadata.bundle.osx]
minimum_system_version = "10.15.7"

[dependencies]
gpui-kit = "0.7.3"
anyhow = "1"
# Local "today" for This Day in Baseball.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# Offscreen rendering for examples/snapshots.rs. Enabled on GPUI directly:
# gpui-kit's own `test-support` feature also resolves the optional GPUI Fast
# backend, whose pinned dependencies conflict with the upstream backend's.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }

[[example]]
name = "snapshots"
path = "examples/snapshots.rs"
