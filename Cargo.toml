[package]
name = "baseball-history-desktop"
version = "0.1.0"
edition = "2024"
description = "Cross-platform desktop client for the Baseball History Project"
license = "MIT"

[dependencies]
gpui-kit = "0.7.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# Offscreen rendering for examples/snapshots.rs. Enabled on GPUI directly:
# gpui-kit's own `test-support` feature also resolves the optional GPUI Fast
# backend, whose pinned dependencies conflict with the upstream backend's.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }

[[example]]
name = "snapshots"
path = "examples/snapshots.rs"
